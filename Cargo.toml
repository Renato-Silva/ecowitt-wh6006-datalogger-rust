[package]
name = "wh6006"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"], optional = true }
libc = "0.2.190"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[features]
# Desktop GUI (`wh6006-gui`): cargo build --release --features gui
gui = ["dep:eframe"]

[[bin]]
name = "wh6006"
path = "src/main.rs"

[[bin]]
name = "wh6006-gui"
path = "src/gui/main.rs"
required-features = ["gui"]
